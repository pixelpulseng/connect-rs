[package]
name = "nonolith-connect"
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rust port of Nonolith Connect: REST/WebSocket dataserver for CEE and ADALM1000 (M1K) source-measure units"
repository = "https://github.com/pixelpulseng/connect-rs"
readme = "README.md"
keywords = ["adalm1000", "smu", "instrumentation", "usb", "websocket"]
categories = ["science", "hardware-support"]

[lib]
name = "connect"
path = "src/lib.rs"

[[bin]]
name = "nonolith-connect"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures-util = "0.3"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
bytes = "1"
nusb = { version = "0.2", features = ["tokio"] }

[profile.release]
debug = true
